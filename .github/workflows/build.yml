name: Build Tizen Widget

on:
  push:
    branches: ['*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .wgt package
        run: |
          zip -r anixart-tizen.wgt \
            config.xml \
            index.html \
            auth-helper.html \
            src/ \
            styles/ \
            assets/ \
            -x '*.DS_Store' '*.git*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anixart-tizen-wgt
          path: anixart-tizen.wgt

      - name: Get version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Anixart Tizen v${{ steps.version.outputs.version }}
          body: |
            Сборка Anixart для Samsung Tizen TV.

            Скачай `anixart-tizen.wgt` и установи через Tizen Studio.
          files: anixart-tizen.wgt
          make_latest: true
