name: Build Tizen Widget

on:
  push:
    branches: ['*']
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build .wgt package
        run: |
          zip -r anixart-tizen.wgt \
            config.xml \
            index.html \
            auth-helper.html \
            src/ \
            styles/ \
            assets/ \
            -x '*.DS_Store' '*.git*'

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anixart-tizen-wgt
          path: anixart-tizen.wgt

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: anixart-tizen.wgt
